# TikTok to Instagram Bot Configuration

# Instagram credentials
instagram:
  username: "YOUR_INSTAGRAM_USERNAME"
  password: "YOUR_INSTAGRAM_PASSWORD"

# TikTok search settings
tiktok:
  # Add hashtags or keywords to search for (without #)
  topics:
    - "producer"
    - "beatmaker"
    - "musicproducer"
    - "producing"

  # --- Filtering ---

  # Minimum views a video should have
  min_views: 1000
  # Minimum likes
  min_likes: 100
  # Minimum comments
  min_comments: 5
  # Minimum engagement rate (likes / views). 0.03 = 3%
  min_engagement_rate: 0.03

  # Maximum video duration in seconds (Instagram Reels max is 90s)
  max_duration: 90
  # Minimum video duration in seconds (skip very short clips)
  min_duration: 5

  # Only download videos whose description contains at least one of these words
  # Leave empty [] to disable keyword filtering
  require_keywords:
    - "beat"
    - "producer"
    - "studio"
    - "mixing"
    - "FL Studio"
    - "Ableton"
    - "melody"
    - "sample"
    - "drum"
    - "808"

  # Skip videos whose description contains any of these words
  # Leave empty [] to disable
  exclude_keywords:
    - "sponsored"
    - "ad"
    - "giveaway"
    - "follow for follow"
    - "f4f"

  # How many videos yt-dlp should fetch per topic (before filtering)
  # More = better selection but slower downloads
  fetch_limit: 20

  # How to rank videos that pass all filters: "engagement", "views", or "recent"
  sort_by: "engagement"

# Posting settings
posting:
  # How many videos to keep in the queue at a time
  queue_size: 5
  # Caption template — {original_author} and {topic} are replaced automatically
  caption_template: |
    🎵 Credit: @{original_author} on TikTok
    .
    Follow for daily {topic} content!
    .
    #producer #beatmaker #musicproducer #beats #studiolife
  # Add "Reposted from TikTok" watermark text overlay
  add_credit_overlay: true

# Storage paths
paths:
  # Where downloaded videos are saved
  downloads: "./downloads"
  # Database file tracking posted videos
  history_db: "./history.json"
